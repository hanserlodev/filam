services:
  - type: web
    name: filam-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build --workspace @filam/api
    startCommand: node apps/api/dist/src/main.js
    preDeployCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GOTRUE_URL
        sync: false
      - key: SERVICE_ROLE_KEY
        sync: false
      - key: GOTRUE_JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
