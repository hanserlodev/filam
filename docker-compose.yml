version: "3.9"

services:
  postgres:
    image: supabase/postgres:15.8.1.085
    container_name: filam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD}
      POSTGRES_DB: filam
    ports:
      # Solo bind local: nunca exponer PostgreSQL a interfaces externas.
      - "127.0.0.1:5432:5432"
    volumes:
      - filam_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d filam"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotrue:
    image: supabase/gotrue:v2.172.0
    container_name: filam-gotrue
    restart: unless-stopped
    environment:
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD}@postgres:5432/filam
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_SECRET: ${LOCAL_GOTRUE_JWT_SECRET:?Set LOCAL_GOTRUE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: 587
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_LOG_LEVEL: info
    ports:
      # Solo bind local: GoTrue solo es accesible desde el host.
      - "127.0.0.1:9999:9999"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  filam_pg_data:
